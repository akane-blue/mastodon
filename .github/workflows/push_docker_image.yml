name: Push our docker image
on:
  push:
    branches:
      - hota/**
  # Build images for pull requests targeting our branches (tagged as pr-<number>)
  pull_request:
    branches:
      - hota/**
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Secrets are not available to pull requests from forks, so only build PRs from this repository
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build docker image for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Keep building the other image even if one of them fails
      fail-fast: false
      matrix:
        include:
          - name: mastodon
            file: Dockerfile
            repo_secret: REGISTRY_REPO
          - name: streaming
            file: streaming/Dockerfile
            repo_secret: REGISTRY_REPO_STREAMING
    steps:
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.REGISTRY_SERVER }}/${{ secrets[matrix.repo_secret] }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=pr
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Give each image its own cache scope so that the two builds do not overwrite each other's cache
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
